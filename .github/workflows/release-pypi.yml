name: Release to PyPI

# Builds one platform wheel per target, so `pip install sap-odata-cli-hsin`
# resolves to a prebuilt `sap-odata` binary on each OS. No Rust toolchain
# required on the user's machine.
#
# Triggers:
#   - push a version tag (`git tag v0.2.0 && git push --tags`) → build + publish
#   - manual run → build only, wheels land in the run's artifacts (tick
#     "publish" to also upload them)
#
# Runnable wheels are smoke-tested by installing them and executing
# `sap-odata --version` on the runner that built them, so a broken archive
# never reaches PyPI.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish the built wheels to PyPI (needs the pypi environment)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ''
            runnable: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # manylinux_2_28 = glibc 2.28 floor (RHEL 8+, Ubuntu 20.04+).
            # Built on AlmaLinux 8 rather than the manylinux2014 (CentOS 7)
            # image: CentOS 7 is past EOL and its package mirrors are
            # unreliable, which matters because the step below installs a
            # perl module into the container.
            manylinux: '2_28'
            # openssl-src ships its own OpenSSL (see crates/core/Cargo.toml)
            # and configures it with `perl ./Configure`. The image's perl is
            # cut down to the bare core, so the dual-life modules Configure
            # requires are missing — first IPC::Cmd, then Time::Piece. Install
            # whichever is absent; the probe keeps it a no-op when present.
            before_script: |
              missing=""
              perl -MIPC::Cmd -e1 2>/dev/null || missing="$missing perl-IPC-Cmd"
              perl -MTime::Piece -e1 2>/dev/null || missing="$missing perl-Time-Piece"
              if [ -n "$missing" ]; then
                echo "installing:$missing"
                dnf install -y $missing || yum install -y $missing
              fi
            runnable: true
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: ''
            runnable: true
          # Intel wheel built on an arm64 runner: it cross-compiles fine, but
          # the smoke test can't execute it here (Rosetta can't be assumed),
          # so this one is verified by wheel-content inspection only.
          - os: macos-14
            target: x86_64-apple-darwin
            manylinux: ''
            runnable: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: ${{ matrix.before_script }}
          args: --release --locked --out dist

      - name: Inspect wheel
        shell: bash
        run: |
          ls -la dist/
          python - <<'PY'
          import glob, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel, got {wheels}")
          print("wheel:", wheels[0].rsplit("/", 1)[-1])

          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
          binaries = [
              n for n in names
              if n.endswith(".data/scripts/sap-odata.exe") or n.endswith(".data/scripts/sap-odata")
          ]
          if not binaries:
              sys.exit(f"no console script inside the wheel: {names}")
          print("binary:", binaries[0])
          PY

      - name: Smoke-test the built wheel
        if: matrix.runnable
        shell: bash
        run: |
          python -m venv .venv-smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=.venv-smoke/Scripts/python.exe
            BIN=.venv-smoke/Scripts/sap-odata.exe
          else
            PY=.venv-smoke/bin/python
            BIN=.venv-smoke/bin/sap-odata
          fi
          "$PY" -m pip install --quiet --disable-pip-version-check dist/*.whl
          "$PY" -m pip show sap-odata-cli-hsin | sed -n '1,3p'
          "$BIN" --version
          "$BIN" --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: build
    # Tag pushes always publish; manual runs only when explicitly asked.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies the OIDC token, no API token secret
    # needed. Configure the publisher once at
    # https://pypi.org/manage/account/publishing/ (see docs/PYPI.md).
    #
    # Uses PyPA's official publish action rather than `maturin upload`:
    # maturin deprecated its upload/publish commands (PyO3/maturin#2334)
    # in favour of twine / uv, and this action handles OIDC + attestations.
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Idempotent re-runs: a platform that already uploaded is skipped
          # instead of failing the whole job.
          skip-existing: true
