name: Release to PyPI

# Builds a platform wheel per target so `pip install sap-odata-explorer`
# resolves to a prebuilt `sap-odata` binary on each OS. No Rust toolchain
# required on the user's machine.
#
# Trigger: push a version tag (e.g. `git tag v0.2.0 && git push --tags`).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # `auto` picks a manylinux image for the Rust target, so the
          # resulting wheel works on older glibc distros too.
          manylinux: auto
          args: --release --out dist

      - name: Smoke-test the built wheel
        shell: bash
        run: |
          python -m venv .venv-smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv-smoke/Scripts/python.exe -m pip install --quiet dist/*.whl
            .venv-smoke/Scripts/sap-odata.exe --version
          else
            .venv-smoke/bin/python -m pip install --quiet dist/*.whl
            .venv-smoke/bin/sap-odata --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies the OIDC token, no API token secret
    # needed. Configure the publisher once at
    # https://pypi.org/manage/account/publishing/ (see docs/PYPI.md).
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          # --skip-existing makes re-runs idempotent if one target failed.
          args: --skip-existing --non-interactive dist/*
